<!-- RIGHT: ABOUT                                          -->
<!-- ===================================================== -->

<g transform="translate(500,20)">

    <!-- Основная dark-карточка -->
    <rect
        x="0"
        y="0"
        width="575"
        height="400"
        rx="20"
        fill="url(#panel-bg)"
    />

    <!-- Слабое свечение -->
    <rect
        x="0"
        y="0"
        width="575"
        height="400"
        rx="20"
        fill="url(#glow)"
    />


    <!-- Маленькая верхняя строка -->
    <g opacity="0">

        <animate
            attributeName="opacity"
            from="0"
            to="1"
            dur="0.5s"
            begin="0.25s"
            fill="freeze"
        />

        <circle
            cx="34"
            cy="34"
            r="4"
            fill="#3fb950"
        />

        <text
            x="48"
            y="39"
            fill="#8b949e"
            font-family="monospace"
            font-size="13">
            beatof1l / profile
        </text>

    </g>


    <!-- Имя -->
    <g opacity="0">

        <animate
            attributeName="opacity"
            from="0"
            to="1"
            dur="0.6s"
            begin="0.45s"
            fill="freeze"
        />

        <text
            x="32"
            y="100"
            fill="#f0f6fc"
            font-family="Arial, sans-serif"
            font-size="38"
            font-weight="700">
            matthew
        </text>

        <!-- professional tag -->
        <rect
            x="32"
            y="119"
            width="286"
            height="30"
            rx="7"
