    viewBox="24 82 470 438"
    role="img"
    aria-label="ASCII portrait">

<defs>

    <mask id="portrait-reveal">
        <rect
            x="24"
            y="82"
            width="470"
            height="0"
            fill="white">

            <animate
                attributeName="height"
                from="0"
                to="438"
                dur="2.1s"
                begin="0.15s"
                fill="freeze"
            />

        </rect>
    </mask>

    <style>
        .ascii {
            font-family: "Courier New", Consolas, monospace;
            font-size: 6.5px;
            letter-spacing: -0.15px;
            fill: #c9d1d9;
        }

        text, tspan {
            white-space: pre;
        }
    </style>

</defs>

