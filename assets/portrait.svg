            y="139"
            fill="#c9d1d9"
            font-family="monospace"
            font-size="14">
            backend / software engineering
        </text>

    </g>


    <!-- ABOUT -->
    <g opacity="0">

        <animate
            attributeName="opacity"
            from="0"
            to="1"
            dur="0.6s"
            begin="0.70s"
            fill="freeze"
        />

        <text
            x="32"
            y="195"
            fill="#58a6ff"
            font-family="monospace"
            font-size="13"
            font-weight="600">
            01 / ABOUT
        </text>

        <text
            x="32"
            y="230"
            fill="#e6edf3"
            font-family="Arial, sans-serif"
            font-size="17">
            Building backend systems, web services
        </text>

        <text
            x="32"
            y="256"
            fill="#e6edf3"
            font-family="Arial, sans-serif"
            font-size="17">
            and personal infrastructure.
        </text>


        <text
            x="32"
            y="302"
            fill="#8b949e"
            font-family="Arial, sans-serif"
            font-size="16">
            Currently focused on C++, Python,
        </text>

        <text
            x="32"
            y="327"
            fill="#8b949e"
            font-family="Arial, sans-serif"
            font-size="16">
            backend development and system design.
        </text>

    </g>


    <!-- Bottom tags -->
    <g opacity="0">

        <animate
            attributeName="opacity"
            from="0"
            to="1"
            dur="0.6s"
            begin="1s"
            fill="freeze"
        />

        <rect
            x="32"
            y="354"
            width="100"
            height="28"
            rx="14"
            fill="#21262d"
        />

