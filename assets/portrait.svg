            text-anchor="middle"
            fill="#d0d7de"
            font-family="monospace"
            font-size="17"
            font-weight="600">
            backend / software engineering
        </text>

    </g>


    <!-- ABOUT TEXT -->
    <g opacity="0">

        <animate
            attributeName="opacity"
            from="0"
            to="1"
            dur="0.6s"
            begin="0.70s"
            fill="freeze"
        />

        <text
            x="48"
            y="235"
            fill="#f0f6fc"
            font-family="Arial, Helvetica, sans-serif"
            font-size="21"
            font-weight="600">
            Building backend systems, web services
        </text>

        <text
            x="48"
            y="268"
            fill="#f0f6fc"
            font-family="Arial, Helvetica, sans-serif"
            font-size="21"
            font-weight="600">
            and personal infrastructure.
        </text>


        <text
            x="48"
            y="321"
            fill="#9da7b3"
            font-family="Arial, Helvetica, sans-serif"
            font-size="19">
            Currently focused on C++, Kotlin,
        </text>

        <text
            x="48"
            y="351"
            fill="#9da7b3"
            font-family="Arial, Helvetica, sans-serif"
            font-size="19">
            backend development and system design.
        </text>

    </g>


    <!-- TAGS -->
    <g opacity="0">

        <animate
            attributeName="opacity"
            from="0"
            to="1"
            dur="0.6s"
            begin="1s"
            fill="freeze"
        />


        <!-- BACKEND -->
        <rect
            x="48"
            y="374"
            width="155"
            height="34"
            rx="17"
            fill="#21262d"
        />

        <text
            x="125.5"
            y="396"
