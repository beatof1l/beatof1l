<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1100"
    height="440"
    viewBox="0 0 1100 440"
    role="img"
    aria-label="Matthew GitHub profile">

<defs>

    <!-- Фон правой карточки -->
    <linearGradient id="panel-bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#161b22"/>
        <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Очень слабый glow -->
    <radialGradient id="glow" cx="0" cy="0.2" r="1">
        <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.16"/>
        <stop offset="55%" stop-color="#58a6ff" stop-opacity="0.03"/>
        <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>

</defs>


<!-- ===================================================== -->
<!-- LEFT: ANIMATED ASCII PORTRAIT                          -->
<!-- ===================================================== -->

<svg
    x="0"
    y="1"
    width="470"
    height="438"
    viewBox="24 82 470 438"
    overflow="hidden">



<defs>

    <mask id="portrait-reveal">
        <rect
            x="24"
            y="82"
            width="470"
            height="0"
            fill="white">

            <animate
                attributeName="height"
                from="0"
                to="438"
                dur="2.1s"
                begin="0.15s"
                fill="freeze"
            />

        </rect>
    </mask>

    <style>
        .ascii {
            font-family: "Courier New", Consolas, monospace;
            font-size: 6.5px;
            letter-spacing: -0.15px;
            fill: #c9d1d9;
        }

        text, tspan {
            white-space: pre;
        }
    </style>

</defs>

