<!-- RIGHT: PROFILE CARD                       -->
<!-- ========================================= -->

<g transform="translate(495,18)">

    <rect
        x="0"
        y="0"
        width="660"
        height="420"
        rx="22"
        fill="url(#panel-bg)"
    />

    <rect
        x="0"
        y="0"
        width="660"
        height="420"
        rx="22"
        fill="url(#glow)"
    />


    <!-- top status -->
    <g opacity="0">

        <animate
            attributeName="opacity"
            from="0"
            to="1"
            dur="0.5s"
            begin="0.25s"
            fill="freeze"
        />

        <circle
            cx="38"
            cy="38"
            r="5"
            fill="#3fb950"
        />

        <text
            x="320"
            y="44"
            text-anchor="middle"
            fill="#8b949e"
            font-family="monospace"
            font-size="15"
            font-weight="600">
            beatof1l / profile
        </text>

    </g>


    <!-- NAME -->
    <g opacity="0">

        <animate
            attributeName="opacity"
            from="0"
            to="1"
            dur="0.55s"
            begin="0.45s"
            fill="freeze"
        />

        <text
            x="330"
            y="112"
            text-anchor="middle"
            fill="#f0f6fc"
            font-family="Arial, Helvetica, sans-serif"
